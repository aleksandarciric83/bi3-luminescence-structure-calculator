name: Tests and programs

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    name: Tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt "pytest<8.4"
      - run: python -m pytest tests -q

  build:
    name: Program for ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows}
          - {os: macos-latest, name: macos}
          - {os: ubuntu-latest, name: linux}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python build_app.py
      - name: Self-test of the packaged program (writes every export file)
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "windows" ]; then exe="dist/Bi3_Calculator/Bi3_Calculator.exe"; else exe="dist/Bi3_Calculator/Bi3_Calculator"; fi
          "$exe" --selftest selftest.txt || true
          for i in $(seq 90); do [ -s selftest.txt ] && break; sleep 1; done
          cat selftest.txt
          grep -q "Self-test passed" selftest.txt
      - name: Zip
        shell: bash
        run: |
          mkdir release
          cd dist
          if [ "${{ matrix.name }}" = "macos" ]; then
            ditto -c -k --sequesterRsrc --keepParent Bi3_Calculator.app ../release/Bi3_Calculator_v2.0.0_macos.zip
          elif [ "${{ matrix.name }}" = "windows" ]; then
            7z a -tzip ../release/Bi3_Calculator_v2.0.0_windows.zip Bi3_Calculator
          else
            zip -qr ../release/Bi3_Calculator_v2.0.0_linux.zip Bi3_Calculator
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Bi3_Calculator_${{ matrix.name }}
          path: release/*.zip

  release:
    name: Attach the programs to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: programs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: programs/*.zip
